Syntax 3

SectionVerb {
        EnableSequence [
                cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
                cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia2' 0"
                cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
                cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 1"
        ]

        DisableSequence [
                cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
                cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia2' 0"
                cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
                cset "name='MultiMedia3 Mixer VA_CODEC_DMA_TX_0' 0"
        ]

        Value {
                TQ "HiFi"
        }
}

SectionDevice."Speaker" {
        Comment "Speaker playback"

        Value {
                PlaybackPriority 150
                PlaybackPCM "hw:${CardId},0"
                PlaybackChannels 2
        }
}

SectionDevice."Mic" {
        Comment "Stereo Microphones"

        EnableSequence [
                cset "name='VA_AIF1_CAP Mixer DEC0' 1"
                cset "name='VA_AIF1_CAP Mixer DEC1' 1"

                cset "name='VA DEC0 MUX' VA_DMIC"
                cset "name='VA DEC1 MUX' VA_DMIC"

                cset "name='VA DMIC MUX0' DMIC2"
                cset "name='VA DMIC MUX1' DMIC0"

                cset "name='VA_DEC0 Volume' 69"
                cset "name='VA_DEC1 Volume' 69"
        ]

        DisableSequence [
                cset "name='VA_AIF1_CAP Mixer DEC0' 0"
                cset "name='VA_AIF1_CAP Mixer DEC1' 0"
        ]

        Value {
                CapturePriority 100
                CapturePCM "hw:${CardId},2"
                CaptureChannels 2
        }
}

SectionDevice."HDMI" {
        Comment "Display Stereo Output"

        EnableSequence [
                cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
                cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia2' 1"
        ]

        DisableSequence [
                cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia2' 0"
                cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
        ]

        Value {
                PlaybackPriority 100
                PlaybackPCM "hw:${CardId},1"
                JackControl "DP0 Jack"
        }
}
