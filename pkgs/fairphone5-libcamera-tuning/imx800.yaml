# SPDX-License-Identifier: CC0-1.0
# Soft-IPA tuning for Fairphone 5 main rear IMX800 (mode-1 4096x3072 SBGGR10).
# Android colorFilterArrangement for camera0 = BGGR.
#
# Black level: soft IPA works on 16-bit samples (10-bit << 6). Sony pedestal
# ~64 DN @10-bit → 64<<6 = 4096 @16-bit (same as imx858/s5kjn1 on this device).
# CCMs: multi-CT set adapted from the working FP5 imx858 soft-IPA profile.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 2676
          ccm: [ 2.02152, -0.41859, -0.60292,
                -0.59481,  2.21509, -0.62029,
                -0.44029, -1.16865,  2.60894 ]
        - ct: 2710
          ccm: [ 2.01597, -0.46478, -0.55119,
                -0.59047,  2.14717, -0.55671,
                -0.40793, -1.19946,  2.60739 ]
        - ct: 2867
          ccm: [ 1.95177, -0.35904, -0.59274,
                -0.44282,  1.97362, -0.53079,
                -0.49059, -1.35379,  2.84439 ]
        - ct: 3474
          ccm: [ 1.97712, -0.60854, -0.36858,
                -0.47723,  1.91142, -0.43418,
                -0.23092, -0.72246,  1.95339 ]
        - ct: 3761
          ccm: [ 2.29903, -0.94652, -0.35251,
                -0.51661,  1.90311, -0.38651,
                -0.25114, -0.67501,  1.92615 ]
        - ct: 4500
          ccm: [ 2.12, -0.78, -0.30,
                -0.48,  1.95, -0.45,
                -0.20, -0.58,  1.78 ]
        - ct: 5500
          ccm: [ 2.02, -0.72, -0.28,
                -0.45,  1.98, -0.52,
                -0.18, -0.54,  1.72 ]
        - ct: 6500
          ccm: [ 1.94, -0.67, -0.26,
                -0.43,  2.01, -0.58,
                -0.16, -0.51,  1.67 ]
        - ct: 6890
          ccm: [ 1.93867, -0.67486, -0.26381,
                -0.43049,  2.00702, -0.57652,
                -0.15696, -0.51345,  1.67041 ]
  - Adjust:
  - Agc:
...
