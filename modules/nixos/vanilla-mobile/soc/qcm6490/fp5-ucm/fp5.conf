# Fairphone 5 — "fairphone,fp5-sndcard", ASoC driver name "qcm6490".
# Looked up as conf.d/qcm6490/<card longname>.conf (fairphone-Fairphone5).
Syntax 4

SectionUseCase."HiFi" {
	File "/Fairphone/fp5/HiFi.conf"
	Comment "HiFi quality Music"
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
# Merges the WCD9385's per-side HPHL/HPHR Volume into one stereo control.
# There is no headphone playback DAI link yet, but the codec and its
# controls are present via the WCD Capture link, so the remap is valid.
Include.wcd-init.File "/codecs/wcd938x/init.conf"
