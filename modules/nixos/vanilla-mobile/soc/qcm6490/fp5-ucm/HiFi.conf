# Fairphone 5 HiFi verb.
#
# Frontend PCMs (numbered by q6asm stream id, NOT dai-link order):
#   hw:X,0  MultiMedia1  -> QUIN_MI2S_RX      2x aw88261 speaker amps
#   hw:X,3  MultiMedia2  <- TX_CODEC_DMA_TX_3 WCD9385 capture (AMICs)
#   hw:X,4  MultiMedia3  -> DISPLAY_PORT_RX   DP over USB-C
#
# The aw88261 amps power up with the stream (DAPM) and need no csets to
# make sound. Their "Amplifier {L,R} Profile Set" enum offers "Music"
# (default, correct for the speakers) and "Receiver" (earpiece tuning —
# relevant for voice calls later, not selected here).

SectionVerb {
	EnableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia3' 1"
	]

	DisableSequence [
		cset "name='QUIN_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='DISPLAY_PORT_RX Audio Mixer MultiMedia3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal stereo speakers"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"

	# AMIC1 -> WCD9385 ADC1 -> TX SWR_INPUT0. This tx-macro names its
	# soundwire inputs SWR_MICn (verified with amixer). ADC1 Volume defaults
	# to 0 of 20 (the quiet mic); 12 measured ~+6 dB.
	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1 Volume' 12"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 100"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},3"
	}
}

SectionDevice."HeadsetMic" {
	Comment "Headset microphone"

	# Same DEC0 decimator as the internal mic; only one can be live.
	ConflictingDevice [
		"Mic"
	]

	# AMIC2 -> WCD9385 ADC2 -> TX SWR_INPUT1 (SWR_MIC1). USB-C headset
	# (there is no 3.5mm jack on this phone).
	EnableSequence [
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='HDR12 MUX' NO_HDR12"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC2 Volume' 12"
		cset "name='TX1 MODE' ADC_NORMAL"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 100"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},3"
		# Jack kcontrols on this card (verified): "Headphone Jack",
		# "Mic Jack", "DP0 Jack", "USB Offload Jack".
		JackControl "Mic Jack"
	}
}

# No DisplayPort SectionDevice, deliberately: with nothing on the USB-C
# port the DP PCM (hw:X,4) times out in snd_pcm_hw_params, and ACP rejects
# the whole profile when any device fails to probe -- taking Speaker and Mic
# with it. The MM3->DISPLAY_PORT_RX routing stays in the verb, so raw DP
# playback (aplay -D hw:X,4) still works with a sink attached.
